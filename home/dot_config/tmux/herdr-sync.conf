# Dedicated inner tmux config for Herdr synchronized-pane islands.
# Keep this separate from ~/.tmux.conf so the nested Herdr workflow can evolve
# without changing normal tmux sessions.

# Terminal capabilities
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB:hyperlinks"
set -g allow-passthrough on
set -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g set-titles on
set -g set-titles-string '#S:#I:#W #{pane_current_path}'

# Responsiveness
set -sg escape-time 10
set -g repeat-time 500

# Prefix
set -g prefix C-b
bind C-b send-prefix
bind r source-file ~/.config/tmux/herdr-sync.conf \; display-message "herdr sync tmux config reloaded"

# History and interaction
set -g history-limit 100000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
setw -g mode-keys vi
set -g set-clipboard on

# Minimal status: make the nested tmux state visible without competing with Herdr.
set -g status-position bottom
set -g status-interval 1
set -g status-justify left
set -g status-left-length 90
set -g status-right-length 90
set -g status-bg '#1e1e2e'
set -g status-fg '#cdd6f4'
set -g status-left '#[bg=#313244,fg=#cdd6f4]#{?client_prefix, PREFIX , #{session_name} }#[default] '
set -g status-right '#[bg=#313244,fg=#cdd6f4] sync=#{?pane_synchronized,on,off} #[default]'
setw -g window-status-format ' #I:#W - #{b:pane_current_path} '
setw -g window-status-current-format '#[bg=#cba6f7,bold,fg=#1e1e2e] #I:#W - #{b:pane_current_path} #[default]'

# Panes. The 3/5 bindings mirror ~/.tmux.conf and leave synchronize-panes on.
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind 3 split-window -v -c "#{pane_current_path}" \; split-window -v -c "#{pane_current_path}" \; select-layout even-vertical \; set-window-option synchronize-panes on
bind 5 split-window -v -c "#{pane_current_path}" \; split-window -v -c "#{pane_current_path}" \; split-window -v -c "#{pane_current_path}" \; split-window -v -c "#{pane_current_path}" \; select-layout even-vertical \; set-window-option synchronize-panes on
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5
bind z resize-pane -Z
bind -n DoubleClick1Pane resize-pane -Z
bind b set-window-option synchronize-panes \; display-message "synchronize-panes #{?pane_synchronized,on,off}"

# Copy mode
set -s copy-command "pbcopy"
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
