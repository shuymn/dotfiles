#!/bin/sh
# Set [merge].message_checks in ~/.config/stack/config.toml and keep every other setting already there:
# stack pr merge checks --subject/--body with these outbound extensions and refuses the merge when one blocks
# or cannot answer (shuymn/stack docs/design/core-stages.md §4.2). Comments in the file are not kept.
# Replace [handover]: the first entry whose env var is set wins, so it is written by hand to keep this order.
exec chezmoi execute-template --with-stdin '
{{- $config := dict -}}
{{- if trim .chezmoi.stdin -}}
{{-   $config = fromToml .chezmoi.stdin -}}
{{- end -}}
{{- $merge := dict -}}
{{- if hasKey $config "merge" -}}
{{-   $merge = get $config "merge" -}}
{{- end -}}
{{- $_ := set $merge "message_checks" (list "public") -}}
{{- $_ := set $config "merge" $merge -}}
{{- $_ := unset $config "handover" -}}
{{- toToml $config }}
[handover]
T3CODE_THREAD_ID = "~/.config/stack/handover/t3.md"
REX_BLOCK = "~/.config/stack/handover/rex.md"
'
