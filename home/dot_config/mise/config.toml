[settings]
disable_backends = ["asdf", "vfox"]
idiomatic_version_file_enable_tools = ["node", "terraform", "pnpm"]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
minimum_release_age = "1d"
npm.package_manager = "bun"
pipx.uvx = true
sops.age_key_file = "~/.config/age/key.txt"

[tools]
bun = "1.3.14"
go = "1.26.6"
node = "24.19.0"
python = "3.14.7"
terraform = "1.15.8"
uv = "0.12.3"

actionlint = "1.7.12"
betterleaks = "v1.7.4"
lazygit = "0.64.1"
lefthook = "2.1.10"
"github:ast-grep/ast-grep" = "0.45.1"
"github:babarot/gh-infra" = "v0.13.0"
"github:tomasz-tomczyk/crit" = "v0.18.4"
"github:go-task/task" = "v3.52.0"
"github:k1LoW/git-wt" = "0.29.0"
"aqua:k1LoW/mo" = "v1.6.7"
"github:Songmu/maltmill" = "1.5.0"
"github:k1LoW/octocov" = "v0.75.12"
"github:k1LoW/roots" = "0.4.1"
"github:ogulcancelik/herdr" = "v0.8.0"
"github:shuymn/kastty" = "0.2.1"
"github:zellij-org/zellij" = "0.44.3"
"github:shuymn/pommitlint" = "2.0.1"
"github:xdevplatform/xurl" = "v1.3.1"
"github:suzuki-shunsuke/ghalint" = "1.5.6"
"github:suzuki-shunsuke/pinact" = "v4.1.1"

claude = "2.1.231"
# The npm package includes the full vendor bundle (including codex-code-mode-host).
"npm:@openai/codex" = "0.147.0"
"npm:@earendil-works/pi-coding-agent" = "0.84.1"
"npm:skills" = "1.5.22"
"pipx:microsandbox" = "0.6.8"
"pipx:tavily-cli" = "0.1.6"

"http:cursor-agent" = { version = "2026.08.11-e8db854", url = "https://downloads.cursor.com/lab/{{ version }}/{{ os(macos='darwin') }}/{{ arch() }}/agent-cli-package.tar.gz", bin = "cursor-agent" }
