[settings]
disable_backends = ["asdf", "vfox"]
idiomatic_version_file_enable_tools = ["node", "terraform", "pnpm"]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
minimum_release_age = "1d"
npm.package_manager = "bun"
pipx.uvx = true
sops.age_key_file = "~/.config/age/key.txt"

[tools]
bun = "1.4.2"
go = "1.27.1"
node = "24.21.0"
python = "3.14.8"
terraform = "1.16.5"
uv = "0.12.22"

actionlint = "1.7.12"
betterleaks = "v1.9.0"
lazygit = "0.65.1"
lefthook = "2.1.16"
"github:ast-grep/ast-grep" = "0.45.3"
"github:babarot/gh-infra" = "v0.14.0"
"github:tomasz-tomczyk/crit" = "v0.21.1"
"github:go-task/task" = "v3.54.0"
"github:k1LoW/git-wt" = "v0.29.3"
"aqua:k1LoW/mo" = "v1.6.9"
"github:Songmu/maltmill" = "1.5.0"
"github:k1LoW/octocov" = "v0.83.1"
"github:k1LoW/roots" = "v0.4.2"
"github:ogulcancelik/herdr" = "v0.9.3"
"github:shuymn/kastty" = "0.2.1"
"github:shuymn/pommitlint" = "2.0.1"
"github:xdevplatform/xurl" = "v1.3.4"
"github:suzuki-shunsuke/ghalint" = "1.5.6"
"github:suzuki-shunsuke/pinact" = "v5.0.0"

claude = "2.1.288"
# The npm package includes the full vendor bundle (including codex-code-mode-host).
"npm:@openai/codex" = "0.160.0"
"npm:@earendil-works/pi-coding-agent" = "1.0.0"
"npm:skills" = "1.7.0"
"pipx:tavily-cli" = "0.1.8"
