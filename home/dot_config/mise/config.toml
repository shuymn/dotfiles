[settings]
disable_backends = ["asdf", "vfox"]
idiomatic_version_file_enable_tools = ["node", "terraform", "pnpm"]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
minimum_release_age = "1d"
npm.package_manager = "bun"
pipx.uvx = true
sops.age_key_file = "~/.config/age/key.txt"

# Each tool tracks its major version; mise.lock pins exact versions and
# .github/workflows/mise-update.yml advances it (see docs/mise-update.md).
[tools]
bun = "1"
go = "1"
node = "24"
python = "3"
terraform = "1"
uv = "0"

actionlint = "1"
betterleaks = "1"
lazygit = "0"
lefthook = "2"
shellcheck = "0"
"github:ast-grep/ast-grep" = "0"
"github:babarot/gh-infra" = "0"
"github:tomasz-tomczyk/crit" = "0"
"github:go-task/task" = "3"
# lf uses rN release tags; the next numbered release is a manual major update.
"github:gokcehan/lf" = { version = "42", version_prefix = "r" }
"github:k1LoW/git-wt" = "0"
"aqua:k1LoW/mo" = "1"
"github:Songmu/maltmill" = "1"
"github:k1LoW/octocov" = "0"
"github:k1LoW/roots" = "0"
"github:ogulcancelik/herdr" = "0"
"github:shuymn/capsule" = "1"
"github:shuymn/kastty" = "0"
"github:shuymn/pommitlint" = "2"
"github:xdevplatform/xurl" = "1"
"github:suzuki-shunsuke/ghalint" = "1"
"github:suzuki-shunsuke/pinact" = "5"
"aqua:kayac/ecspresso" = "2"
# Exact pin, so `mise lock --bump` never moves it: v0.39.0+ ships no Developer ID
# signed macOS binary, and an ad-hoc signed build loses its keychain "Always
# Allow" on every rebuild (fwdcloudsec/granted#936). Widen the range once
# signed macOS releases return.
# aqua creates the macOS assumego -> granted link missing from release archives.
"aqua:fwdcloudsec/granted" = "0.38.0"

claude = "2"
# The npm package includes the full vendor bundle (including codex-code-mode-host).
"npm:@openai/codex" = "0"
# Release archives name the binary "antigravity"; expose it as the documented "agy".
"github:google-antigravity/antigravity-cli" = { version = "1", bin = "agy" }
"npm:@earendil-works/pi-coding-agent" = "1"
"npm:skills" = "1"
"pipx:tavily-cli" = "0"
