[settings]
disable_backends = ["asdf", "vfox"]
idiomatic_version_file_enable_tools = ["node", "terraform", "pnpm"]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
minimum_release_age = "1d"
npm.package_manager = "bun"
pipx.uvx = true
sops.age_key_file = "~/.config/age/key.txt"

[tools]
bun = "1.4.2"
go = "1.27.1"
node = "24.21.0"
python = "3.14.7"
terraform = "1.16.4"
uv = "0.12.18"

actionlint = "1.7.12"
betterleaks = "v1.8.1"
lazygit = "0.65.1"
lefthook = "2.1.14"
"github:ast-grep/ast-grep" = "0.45.3"
"github:babarot/gh-infra" = "v0.13.0"
"github:tomasz-tomczyk/crit" = "v0.20.2"
"github:go-task/task" = "v3.53.1"
"github:k1LoW/git-wt" = "v0.29.3"
"aqua:k1LoW/mo" = "v1.6.8"
"github:Songmu/maltmill" = "1.5.0"
"github:k1LoW/octocov" = "v0.80.1"
"github:k1LoW/roots" = "0.4.1"
"github:ogulcancelik/herdr" = "v0.9.1"
"github:shuymn/kastty" = "0.2.1"
"github:zellij-org/zellij" = "v0.45.1"
"github:shuymn/pommitlint" = "2.0.1"
"github:xdevplatform/xurl" = "v1.3.1"
"github:suzuki-shunsuke/ghalint" = "1.5.6"
"github:suzuki-shunsuke/pinact" = "v4.1.1"

claude = "2.1.281"
# The npm package includes the full vendor bundle (including codex-code-mode-host).
"npm:@openai/codex" = "0.156.1"
"npm:@earendil-works/pi-coding-agent" = "0.87.1"
"npm:skills" = "1.7.0"
"pipx:microsandbox" = "0.7.2"
"pipx:tavily-cli" = "0.1.8"

"http:cursor-agent" = { version = "2026.09.23-86fc751", url = "https://downloads.cursor.com/lab/{{ version }}/{{ os(macos='darwin') }}/{{ arch() }}/agent-cli-package.tar.gz", bin = "cursor-agent" }
