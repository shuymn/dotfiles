# Herdr owns workspaces, tabs, panes, and copy mode; Ghostty stays thin.
# Keep only intentional overrides of Herdr's defaults.
onboarding = false

[terminal]
default_shell = "zsh"
kitty_graphics = true

[theme]
name = "terminal"

[ui]
sidebar_width = 32
sidebar_min_width = 20
sidebar_max_width = 40
mobile_width_threshold = 72
right_click_passthrough_modifier = "ctrl"
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true
accent = "#cba6f7"

[ui.toast]
# Let Ghostty surface background notifications as macOS notifications.
delivery = "terminal"

[ui.sound]
enabled = false

[advanced]
scrollback_limit_bytes = 104857600

[experimental]
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["pi", "claude", "codex", "cursor", "opencode"]
switch_ascii_input_source_in_prefix = true

[keys]
# Other movement/copy bindings use the tmux-style defaults (prefix = ctrl+b).
split_horizontal = "prefix+s"
# Free the swap-pane defaults for workspace movement.
swap_pane_down = ""
swap_pane_up = ""
previous_workspace = "prefix+shift+k"
next_workspace = "prefix+shift+j"

# Keep prefix+r as reload; move resize mode and settings aside.
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
settings = "prefix+comma"

# Splits/tabs follow the focused pane by default; new workspaces start at home.
new_workspace = ""

[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = "herdr workspace create --cwd ~ --focus"
description = "new workspace from home"
