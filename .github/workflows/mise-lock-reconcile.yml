name: Reconcile mise.lock

on:
  workflow_run:
    workflows:
      - Generate mise.lock candidate
    types:
      - completed

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      has_candidate: ${{ steps.artifact.outputs.has_candidate }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0

      - name: Find candidate artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -eu
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "mise-lock-candidate")] | length')
          if [ "$count" -eq 0 ]; then
            echo "has_candidate=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$count" -ne 1 ]; then
            echo "expected exactly one mise-lock-candidate artifact" >&2
            exit 1
          fi
          echo "has_candidate=true" >>"$GITHUB_OUTPUT"

      - name: Download candidate
        if: steps.artifact.outputs.has_candidate == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mise-lock-candidate
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Bind candidate to current PR head
        if: steps.artifact.outputs.has_candidate == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo "workflow_run has no valid pull request" >&2; exit 1 ;;
          esac
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          state=$(printf '%s' "$pr" | jq -r '.state')
          head_sha=$(printf '%s' "$pr" | jq -r '.head.sha')
          head_ref=$(printf '%s' "$pr" | jq -r '.head.ref')
          head_repo_id=$(printf '%s' "$pr" | jq -r '.head.repo.id')
          base_sha=$(printf '%s' "$pr" | jq -r '.base.sha')
          if [ "$state" != open ] || [ "$head_sha" != "$RUN_HEAD_SHA" ] || [ "$head_repo_id" != "$REPOSITORY_ID" ]; then
            echo "candidate no longer belongs to the current same-repository PR head" >&2
            exit 1
          fi
          git fetch --no-tags origin "$base_sha" "$head_sha"
          {
            echo "pr_number=$PR_NUMBER"
            echo "base_sha=$base_sha"
            echo "head_sha=$head_sha"
            echo "head_ref=$head_ref"
          } >>"$GITHUB_OUTPUT"

      - name: Verify untrusted candidate
        if: steps.artifact.outputs.has_candidate == 'true'
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -eu
          candidate="$RUNNER_TEMP/candidate/mise.lock"
          if [ ! -f "$candidate" ] || [ -L "$candidate" ]; then
            echo "candidate artifact must contain one regular mise.lock file" >&2
            exit 1
          fi
          if [ "$(find "$RUNNER_TEMP/candidate" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" -ne 1 ]; then
            echo "candidate artifact contains unexpected entries" >&2
            exit 1
          fi
          python3 scripts/verify-mise-lock-candidate.py \
            --repo . \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --candidate "$candidate" \
            --repository-id "$REPOSITORY_ID" \
            --pull-request "$PR_NUMBER" \
            --head-ref "$HEAD_REF" \
            --output "$RUNNER_TEMP/candidate/attestation.json"

      - name: Upload validated candidate
        if: steps.artifact.outputs.has_candidate == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-mise-lock-candidate
          path: |
            ${{ runner.temp }}/candidate/mise.lock
            ${{ runner.temp }}/candidate/attestation.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  commit:
    needs: validate
    if: needs.validate.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download validated candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-mise-lock-candidate
          path: ${{ runner.temp }}/validated

      - name: Recheck current PR head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_REF: ${{ needs.validate.outputs.head_ref }}
          EXPECTED_HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -eu
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          test "$(printf '%s' "$pr" | jq -r '.state')" = open
          test "$(printf '%s' "$pr" | jq -r '.head.sha')" = "$EXPECTED_HEAD_SHA"
          test "$(printf '%s' "$pr" | jq -r '.head.ref')" = "$EXPECTED_HEAD_REF"
          test "$(printf '%s' "$pr" | jq -r '.head.repo.id')" = "$REPOSITORY_ID"

      - name: Create lock maintainer token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit validated candidate
        env:
          MISE_LOCK_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 scripts/commit-mise-lock-candidate.py \
            --repository "$GITHUB_REPOSITORY" \
            --candidate "$RUNNER_TEMP/validated/mise.lock" \
            --attestation "$RUNNER_TEMP/validated/attestation.json"
