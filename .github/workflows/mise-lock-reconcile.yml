name: Reconcile mise.lock

on:
  workflow_run:
    workflows:
      - Generate mise.lock candidate
    types:
      - completed

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      has_candidate: ${{ steps.artifact.outputs.has_candidate }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      candidate_sha256: ${{ steps.verify.outputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0

      - name: Find candidate artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -eu
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "mise-lock-candidate")] | length')
          if [ "$count" -eq 0 ]; then
            echo "has_candidate=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$count" -ne 1 ]; then
            echo "expected exactly one mise-lock-candidate artifact" >&2
            exit 1
          fi
          echo "has_candidate=true" >>"$GITHUB_OUTPUT"

      - name: Download candidate
        if: steps.artifact.outputs.has_candidate == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mise-lock-candidate
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Bind candidate to current PR head
        if: steps.artifact.outputs.has_candidate == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo "workflow_run has no valid pull request" >&2; exit 1 ;;
          esac
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          state=$(printf '%s' "$pr" | jq -r '.state')
          head_sha=$(printf '%s' "$pr" | jq -r '.head.sha')
          head_ref=$(printf '%s' "$pr" | jq -r '.head.ref')
          head_repo_id=$(printf '%s' "$pr" | jq -r '.head.repo.id')
          base_sha=$(printf '%s' "$pr" | jq -r '.base.sha')
          if [ "$state" != open ] || [ "$head_sha" != "$RUN_HEAD_SHA" ] || [ "$head_repo_id" != "$REPOSITORY_ID" ]; then
            echo "candidate no longer belongs to the current same-repository PR head" >&2
            exit 1
          fi
          case "$head_ref" in
            renovate/*) ;;
            *) echo "candidate head must be a Renovate branch" >&2; exit 1 ;;
          esac
          git fetch --no-tags origin "$base_sha" "$head_sha"
          {
            echo "pr_number=$PR_NUMBER"
            echo "base_sha=$base_sha"
            echo "head_sha=$head_sha"
            echo "head_ref=$head_ref"
          } >>"$GITHUB_OUTPUT"

      - name: Verify untrusted candidate
        if: steps.artifact.outputs.has_candidate == 'true'
        id: verify
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -eu
          candidate="$RUNNER_TEMP/candidate/mise.lock"
          if [ ! -f "$candidate" ] || [ -L "$candidate" ]; then
            echo "candidate artifact must contain one regular mise.lock file" >&2
            exit 1
          fi
          if [ "$(find "$RUNNER_TEMP/candidate" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" -ne 1 ]; then
            echo "candidate artifact contains unexpected entries" >&2
            exit 1
          fi
          python3 scripts/verify-mise-lock-candidate.py \
            --repo . \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --candidate "$candidate"
          echo "candidate_sha256=$(sha256sum "$candidate" | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"

      - name: Upload validated candidate
        if: steps.artifact.outputs.has_candidate == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-mise-lock-candidate
          path: ${{ runner.temp }}/candidate/mise.lock
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  commit:
    needs: validate
    if: needs.validate.outputs.has_candidate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Download validated candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-mise-lock-candidate
          path: ${{ runner.temp }}/validated

      - name: Verify downloaded candidate
        env:
          EXPECTED_SHA256: ${{ needs.validate.outputs.candidate_sha256 }}
        run: |
          set -eu
          candidate="$RUNNER_TEMP/validated/mise.lock"
          if [ ! -f "$candidate" ] || [ -L "$candidate" ]; then
            echo "validated artifact must contain one regular mise.lock file" >&2
            exit 1
          fi
          if [ "$(find "$RUNNER_TEMP/validated" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" -ne 1 ]; then
            echo "validated artifact contains unexpected entries" >&2
            exit 1
          fi
          test "$(sha256sum "$candidate" | cut -d ' ' -f 1)" = "$EXPECTED_SHA256"

      - name: Recheck current PR head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_REF: ${{ needs.validate.outputs.head_ref }}
          EXPECTED_HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -eu
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          test "$(printf '%s' "$pr" | jq -r '.state')" = open
          test "$(printf '%s' "$pr" | jq -r '.head.sha')" = "$EXPECTED_HEAD_SHA"
          test "$(printf '%s' "$pr" | jq -r '.head.ref')" = "$EXPECTED_HEAD_REF"
          test "$(printf '%s' "$pr" | jq -r '.head.repo.id')" = "$REPOSITORY_ID"

      - name: Create lock maintainer token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit validated candidate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPECTED_HEAD_REF: ${{ needs.validate.outputs.head_ref }}
          EXPECTED_HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
          GRAPHQL_QUERY: >-
            mutation($input: CreateCommitOnBranchInput!) {
              createCommitOnBranch(input: $input) {
                commit { oid }
                ref { target { oid } }
              }
            }
        run: |
          set -eu
          candidate="$RUNNER_TEMP/validated/mise.lock"
          jq -n \
            --arg query "$GRAPHQL_QUERY" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$EXPECTED_HEAD_REF" \
            --arg head "$EXPECTED_HEAD_SHA" \
            --arg pr_number "$PR_NUMBER" \
            --rawfile candidate "$candidate" \
            '{query: $query, variables: {input: {branch: {repositoryNameWithOwner: $repository, branchName: $branch}, expectedHeadOid: $head, message: {headline: "Update mise.lock", body: ("Source-PR: #" + $pr_number + "\nSource-Head: " + $head)}, fileChanges: {additions: [{path: "home/dot_config/mise/mise.lock", contents: ($candidate | @base64)}]}}}}' \
            >"$RUNNER_TEMP/create-mise-lock-commit.json"
          test "$(jq -r '.variables.input.message.body | split("\n") | length' "$RUNNER_TEMP/create-mise-lock-commit.json")" = 2
          result=$(gh api graphql --input "$RUNNER_TEMP/create-mise-lock-commit.json")
          commit=$(printf '%s' "$result" | jq -r '.data.createCommitOnBranch.commit.oid')
          ref_target=$(printf '%s' "$result" | jq -r '.data.createCommitOnBranch.ref.target.oid')
          test "$commit" = "$ref_target"
          case "$commit" in
            *[!0-9a-f]*|'') echo "GitHub returned an invalid commit OID" >&2; exit 1 ;;
          esac
          printf '%s\n' "$commit"
