name: Test repository automation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/automation.yml
      - tests/*.py
      - home/dot_claude/hooks/**
      - home/dot_claude/attention/**
      - home/dot_claude/modify_private_settings.json
      - scripts/kaizen/**
      - home/dot_claude/executable_statusline.sh.tmpl
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/automation.yml
      - tests/*.py
      - home/dot_claude/hooks/**
      - home/dot_claude/attention/**
      - home/dot_claude/modify_private_settings.json
      - scripts/kaizen/**
      - home/dot_claude/executable_statusline.sh.tmpl

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Python automation
        run: python3 -m unittest discover -s tests
