name: Test repository automation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/automation.yml
      - .github/workflows/mise-lock-candidate.yml
      - .github/workflows/mise-lock-reconcile.yml
      - scripts/*.py
      - tests/*.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/automation.yml
      - .github/workflows/mise-lock-candidate.yml
      - .github/workflows/mise-lock-reconcile.yml
      - scripts/*.py
      - tests/*.py

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Python automation
        run: python3 -m unittest discover -s tests
