name: Update mise tools

# Only this workflow writes home/dot_config/mise/{config.toml,mise.lock}
# automatically. generate runs upstream installers without write credentials,
# so its outputs and artifacts are untrusted: verify checks the result without
# credentials, and publish holds the maintainer App token without running mise,
# Nix, or generated code. verify and publish check out github.sha, never a ref
# reported by generate.

on:
  schedule:
    - cron: "23 21 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.generate.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Generate update
        id: generate
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          MISE_USE_VERSIONS_HOST: 1
          MISE_YES: 1
        run: |
          set -eu
          nix --extra-experimental-features nix-command --extra-experimental-features flakes shell .#mise -c \
            python3 scripts/update-mise-tools.py --report "$RUNNER_TEMP/report.md" --source "$GITHUB_SHA"
          cat "$RUNNER_TEMP/report.md" >>"$GITHUB_STEP_SUMMARY"
          dirty=$(git status --porcelain --untracked-files=all)
          if [ -z "$dirty" ]; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          unexpected=$(printf '%s\n' "$dirty" | grep -Ev '^ M home/dot_config/mise/(config\.toml|mise\.lock)$' || true)
          if [ -n "$unexpected" ]; then
            echo "mise update produced unexpected changes:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/candidate"
          cp home/dot_config/mise/config.toml home/dot_config/mise/mise.lock "$RUNNER_TEMP/candidate/"
          echo "changed=true" >>"$GITHUB_OUTPUT"

      - name: Upload candidate
        if: steps.generate.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mise-update-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  verify:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.verify.outputs.artifact_sha256 }}
      content_sha256: ${{ steps.verify.outputs.content_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mise-update-candidate
          path: ${{ runner.temp }}/candidate

      - name: Verify untrusted candidate
        id: verify
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          candidate="$RUNNER_TEMP/candidate"
          if [ "$(find "$candidate" -mindepth 1 | wc -l | tr -d ' ')" -ne 2 ]; then
            echo "candidate artifact must contain only config.toml and mise.lock" >&2
            exit 1
          fi
          validated="$RUNNER_TEMP/validated"
          mkdir -p "$validated"
          python3 scripts/verify-mise-lock-candidate.py \
            --base-config home/dot_config/mise/config.toml \
            --base-lock home/dot_config/mise/mise.lock \
            --config "$candidate/config.toml" \
            --candidate "$candidate/mise.lock" \
            --run-url "$RUN_URL" \
            --title-out "$validated/title.txt" \
            --body-out "$validated/body.md"
          cp "$candidate/config.toml" "$candidate/mise.lock" "$validated/"
          cd "$validated"
          echo "content_sha256=$(sha256sum config.toml mise.lock | sha256sum | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
          echo "artifact_sha256=$(sha256sum body.md config.toml mise.lock title.txt | sha256sum | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"

      - name: Upload validated candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-mise-update
          path: ${{ runner.temp }}/validated/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: [generate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download validated candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-mise-update
          path: ${{ runner.temp }}/validated

      - name: Verify downloaded candidate
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.artifact_sha256 }}
        run: |
          set -eu
          cd "$RUNNER_TEMP/validated"
          if [ "$(find . -mindepth 1 | wc -l | tr -d ' ')" -ne 4 ]; then
            echo "validated artifact contains unexpected entries" >&2
            exit 1
          fi
          for file in body.md config.toml mise.lock title.txt; do
            if [ ! -f "$file" ] || [ -L "$file" ]; then
              echo "validated artifact must contain regular file $file" >&2
              exit 1
            fi
          done
          test "$(sha256sum body.md config.toml mise.lock title.txt | sha256sum | cut -d ' ' -f 1)" = "$EXPECTED_SHA256"

      - name: Create maintainer token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_BRANCH: ${{ github.ref_name }}
          BASE_SHA: ${{ github.sha }}
          CONTENT_SHA256: ${{ needs.verify.outputs.content_sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_QUERY: >-
            mutation($input: CreateCommitOnBranchInput!) {
              createCommitOnBranch(input: $input) {
                commit { oid }
                ref { target { oid } }
              }
            }
          AUTO_MERGE_QUERY: >-
            mutation($id: ID!) {
              enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: MERGE}) {
                clientMutationId
              }
            }
        run: |
          set -eu
          validated="$RUNNER_TEMP/validated"
          branch="mise-update/$(printf '%s' "$CONTENT_SHA256" | cut -c 1-16)"
          owner=${GITHUB_REPOSITORY%%/*}

          # The branch name identifies the candidate content. An open PR means
          # this update is already proposed; a closed one means it was rejected.
          existing=$(/bin/sh scripts/gh-api-retry.sh "repos/$GITHUB_REPOSITORY/pulls?state=all&head=$owner:$branch&per_page=1" --jq '.[0].state // ""')
          if [ -n "$existing" ]; then
            echo "pull request for $branch is already $existing"
            exit 0
          fi
          # A branch without any PR is left over from an interrupted run.
          if /bin/sh scripts/gh-api-retry.sh "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$BASE_SHA" >/dev/null

          jq -n \
            --arg query "$COMMIT_QUERY" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$branch" \
            --arg head "$BASE_SHA" \
            --arg run_url "$RUN_URL" \
            --rawfile title "$validated/title.txt" \
            --rawfile config "$validated/config.toml" \
            --rawfile lock "$validated/mise.lock" \
            '{query: $query, variables: {input: {branch: {repositoryNameWithOwner: $repository, branchName: $branch}, expectedHeadOid: $head, message: {headline: ($title | rtrimstr("\n")), body: ("Generated-By: " + $run_url)}, fileChanges: {additions: [{path: "home/dot_config/mise/config.toml", contents: ($config | @base64)}, {path: "home/dot_config/mise/mise.lock", contents: ($lock | @base64)}]}}}}' \
            >"$RUNNER_TEMP/create-commit.json"
          # createCommitOnBranch is guarded by expectedHeadOid; keep it single-shot
          # and let a re-run recreate the leftover branch instead of retrying.
          result=$(gh api graphql --input "$RUNNER_TEMP/create-commit.json")
          commit=$(printf '%s' "$result" | jq -r '.data.createCommitOnBranch.commit.oid')
          test "$commit" = "$(printf '%s' "$result" | jq -r '.data.createCommitOnBranch.ref.target.oid')"

          pr=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" \
            -f title="$(cat "$validated/title.txt")" \
            -f head="$branch" \
            -f base="$BASE_BRANCH" \
            -F body=@"$validated/body.md")
          number=$(printf '%s' "$pr" | jq -r '.number')
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$number/labels" -f 'labels[]=dependencies' >/dev/null
          gh api graphql -f query="$AUTO_MERGE_QUERY" -f id="$(printf '%s' "$pr" | jq -r '.node_id')" >/dev/null
          echo "opened #$number from $branch at $commit"

          /bin/sh scripts/gh-api-retry.sh "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" |
            jq -r --arg repo "$GITHUB_REPOSITORY" --arg branch "$branch" \
              '.[] | select(.head.repo.full_name == $repo and (.head.ref | startswith("mise-update/")) and .head.ref != $branch) | "\(.number) \(.head.ref)"' |
            while read -r superseded ref; do
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$superseded" -f state=closed >/dev/null
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ref"
              echo "closed superseded #$superseded"
            done
