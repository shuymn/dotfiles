name: Validate Renovate config

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/renovate-validate.yml
      - .github/renovate.json
      - .github/renovate-version
      - home/dot_config/mise/config.toml
      - scripts/check-mise-renovate-age.py
      - scripts/check-mise-renovate-age.sh
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/renovate-validate.yml
      - .github/renovate.json
      - .github/renovate-version
      - home/dot_config/mise/config.toml
      - scripts/check-mise-renovate-age.py
      - scripts/check-mise-renovate-age.sh

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Read Renovate compatibility version
        id: renovate
        shell: bash
        run: |
          set -euo pipefail
          version=$(<.github/renovate-version)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid Renovate version: $version" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-renovate-${{ steps.renovate.outputs.version }}-${{ runner.os }}

      - name: Validate repository config
        env:
          RENOVATE_VERSION: ${{ steps.renovate.outputs.version }}
        run: bunx --package=renovate@"${RENOVATE_VERSION:?}" renovate-config-validator --strict --no-global .github/renovate.json

      - name: Check mise datasource compatibility
        run: make check-mise-renovate
