name: autofix.ci

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  mise-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate PR scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          git diff --name-only "$BASE_SHA"...HEAD >"$RUNNER_TEMP/changed-files"
          has_config=false
          has_lock=false
          if grep -qx 'home/dot_config/mise/config.toml' "$RUNNER_TEMP/changed-files"; then
            has_config=true
          fi
          if grep -qx 'home/dot_config/mise/mise.lock' "$RUNNER_TEMP/changed-files"; then
            has_lock=true
          fi
          if [ "$has_config" = false ]; then
            if [ "$has_lock" = true ]; then
              echo "mise.lock changed without mise config; refusing lock-only Renovate PR" >&2
              exit 1
            fi
            echo "update=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          unexpected=$(grep -Ev '^(home/dot_config/mise/config\.toml|home/dot_config/mise/mise\.lock)$' "$RUNNER_TEMP/changed-files" || true)
          if [ -n "$unexpected" ]; then
            echo "mise lock autofix only accepts Renovate PRs that change mise config/lock files:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          echo "update=true" >>"$GITHUB_OUTPUT"

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4
        if: steps.scope.outputs.update == 'true'
        with:
          version: 2026.6.13
          install: false
          cache: false

      - name: Update mise.lock for changed tools
        if: steps.scope.outputs.update == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          MISE_YES: 1
        run: python3 scripts/update-mise-lock-for-changed-tools.py --base "$BASE_SHA"

      - name: Validate generated diff
        if: steps.scope.outputs.update == 'true'
        run: |
          set -eu
          git reset --mixed
          {
            git diff --name-only
            git diff --cached --name-only
            git ls-files --others --exclude-standard
          } | sort -u >"$RUNNER_TEMP/dirty-files"
          unexpected=$(grep -Ev '^home/dot_config/mise/mise\.lock$' "$RUNNER_TEMP/dirty-files" || true)
          if [ -n "$unexpected" ]; then
            echo "mise lock updater generated unexpected files:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Detect mise.lock diff
        id: lock_diff
        if: steps.scope.outputs.update == 'true'
        run: |
          if git diff --quiet -- home/dot_config/mise/mise.lock; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Commit mise.lock update
        id: autofix
        if: steps.scope.outputs.update == 'true' && steps.lock_diff.outputs.changed == 'true'
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
        with:
          commit-message: Update mise.lock

      - name: Wait for autofix commit
        if: steps.autofix.outputs.autofix_started == 'true'
        run: |
          echo "autofix.ci is committing mise.lock; the next PR head must pass this workflow." >&2
          exit 1
