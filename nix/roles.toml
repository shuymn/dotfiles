# Role composition shared by nix-darwin, Home Manager, and chezmoi.
# Each name selects nix/darwin/profiles/<name>.nix or nix/home/profiles/<name>.nix
# on top of the common profile. host.toml picks one role.

[minimal]
darwin = []
home = []

[personal-lite]
darwin = ["dev", "lite"]
home = ["dev"]

[personal]
darwin = ["dev", "lite", "flashspace", "llm", "personal"]
home = ["dev"]

[devhost]
darwin = ["headless"]
home = ["dev", "docker", "headless"]

[work]
darwin = ["flashspace", "dev", "llm", "work"]
home = ["dev", "docker", "work"]
